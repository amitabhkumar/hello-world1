name: NSE REG1 and price bands
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Exact report date YYYY-MM-DD; blank selects previous eligible session in the morning, with exact-date inventory validation'
        type: string
        required: false
  push:
    paths: ['nse_automation/**', '.github/workflows/nse_restrictions.yml']
  schedule:
    # Buffered odd-minute schedules (IST): 20:47 daily (after 20:35 NSE window), 07:52 weekdays, 06:33 Saturday
    - cron: '17 15 * * *'
    - cron: '22 2 * * 1-5'
    - cron: '3 1 * * 6'

permissions:
  contents: read

concurrency:
  group: nse-restrictions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Create isolated Python environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv
          python3 -m venv /tmp/nse-venv
          /tmp/nse-venv/bin/python -m pip install playwright==1.56.0
          echo '/tmp/nse-venv/bin' >> "$GITHUB_PATH"

      - name: Validate calendar and interpretation before acquisition
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_nse_*.py'

      - name: Download exact dated reports once
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          xvfb-run --auto-servernum python nse_automation/download.py "${args[@]}"

      - name: Optional verified Drive handoff
        if: always()
        continue-on-error: true
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_INCOMING_FOLDER_ID: ${{ secrets.GDRIVE_INCOMING_FOLDER_ID }}
          GDRIVE_LOGS_FOLDER_ID: ${{ secrets.GDRIVE_LOGS_FOLDER_ID }}
        run: |
          if [ -n "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            python3 -m venv /tmp/titan-drive-venv
            /tmp/titan-drive-venv/bin/pip install google-auth==2.40.3 requests==2.32.4
            /tmp/titan-drive-venv/bin/python -m titan.drive_sync --root nse-output
          else
            python3 -m titan.drive_sync --root nse-output
          fi

      - name: Deliver and verify via Drive OAuth
        if: always()
        continue-on-error: true
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_INCOMING_FOLDER_ID: ${{ secrets.GDRIVE_INCOMING_FOLDER_ID }}
        uses: ./.github/actions/drive-oauth
        with:
          root: nse-output

      - name: Preserve successful files and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-restrictions-${{ github.run_id }}-${{ github.run_attempt }}
          path: nse-output/
          retention-days: 90
          if-no-files-found: error
