name: NSE REG1 and price bands
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Exact report date YYYY-MM-DD; blank selects eligible session using official calendar'
        type: string
        required: false
  push:
    paths: ['nse_automation/**', '.github/workflows/nse_restrictions.yml']
  schedule:
    # SOP starts in IST: 08:30 weekdays, 16:30 weekdays, 22:00 daily, Saturday 08:00.
    - cron: '0 3 * * 1-5'
    - cron: '0 11 * * 1-5'
    - cron: '30 16 * * *'
    - cron: '30 2 * * 6'
permissions:
  contents: read
concurrency:
  group: nse-restrictions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Python environment
        run: |
          python3 -m venv /tmp/nse-venv
          /tmp/nse-venv/bin/python -m pip install playwright==1.56.0
          echo '/tmp/nse-venv/bin' >> "$GITHUB_PATH"
      - name: Validate calendar and interpretation before acquisition
        run: PYTHONPATH=. python tests/test_nse_session_selection.py
      - name: Download exact dated reports once
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          xvfb-run --auto-servernum python nse_automation/download.py "${args[@]}"
      - name: Preserve successful files and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-restrictions-${{ github.run_id }}-${{ github.run_attempt }}
          path: nse-output/
          retention-days: 90
          if-no-files-found: error
