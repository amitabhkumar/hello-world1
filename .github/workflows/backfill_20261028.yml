name: TITAN BSE 28 October history reconciliation
on:
  push:
    paths: ['titan/backfill_20261028.py', '.github/workflows/backfill_20261028.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-bse.txt
      - run: python -m playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum python -m titan.backfill_20261028
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bse-history-20261028-${{ github.run_id }}
          path: backfill_output/
          retention-days: 7
