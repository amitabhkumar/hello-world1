name: NSE final equity delivery and indices
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional exact eligible YYYY-MM-DD
        type: string
        required: false
  push:
    paths: ['nse_automation/market_data.py', '.github/workflows/nse_market_data.yml']
  schedule:
    - cron: '39 2 * * 1-5'   # 08:09 IST Mon-Fri (Morning Scan 08:30)
    - cron: '7 16 * * *'     # 21:37 IST Daily   (Evening Scan 22:00)
    - cron: '7 2 * * 6'      # 07:37 IST Sat     (Weekly Review 08:00)

permissions:
  contents: read

concurrency:
  group: nse-final-market-data
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated browser runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv
          python3 -m venv /tmp/market-venv
          /tmp/market-venv/bin/pip install playwright==1.56.0

      - name: Acquire exact eligible final files once
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: PYTHONPATH="$GITHUB_WORKSPACE" xvfb-run --auto-servernum /tmp/market-venv/bin/python -m nse_automation.market_data

      - name: Optional verified Drive handoff
        if: always()
        continue-on-error: true
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_INCOMING_FOLDER_ID: ${{ secrets.GDRIVE_INCOMING_FOLDER_ID }}
          GDRIVE_LOGS_FOLDER_ID: ${{ secrets.GDRIVE_LOGS_FOLDER_ID }}
        run: |
          if [ -n "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            python3 -m venv /tmp/titan-drive-venv
            /tmp/titan-drive-venv/bin/pip install google-auth==2.40.3 requests==2.32.4
            /tmp/titan-drive-venv/bin/python -m titan.drive_sync --root nse-market-output
          else
            python3 -m titan.drive_sync --root nse-market-output
          fi

      - name: Deliver and verify via Drive OAuth
        if: always()
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_INCOMING_FOLDER_ID: ${{ secrets.GDRIVE_INCOMING_FOLDER_ID }}
        uses: ./.github/actions/drive-oauth
        with:
          root: nse-market-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nse-market-${{ github.run_id }}-${{ github.run_attempt }}
          path: nse-market-output/
          retention-days: 90
