name: AEGIS NIFTY candle-based options backtest v0.1
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis-backtest.yml'
      - 'aegis/backtest_v01.py'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        year: [2024, 2025, 2026]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backtest research dependencies
        run: python -m pip install 'duckdb>=1.2,<2' 'pandas>=2.1,<3' 'numpy>=1.26,<3' 'pyarrow>=17,<24'
      - name: Download checksum-pinned public NIFTY 1-minute options
        run: python aegis/download_intraday_one.py --year ${{ matrix.year }}
      - name: Download checksum-pinned spot/futures/VIX
        run: python aegis/download_market_context.py
      - name: Run fixed-rule AEGIS and baseline simulation
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Asia/Kolkata
          FILE="AEGIS_INTRADAY_${{ matrix.year }}/NIFTY_${{ matrix.year }}.parquet"
          test -s "$FILE"
          python aegis/backtest_v01.py --year ${{ matrix.year }} --parquet "$FILE" --support AEGIS_SUPPORT
      - name: Save per-trade evidence + summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-backtest-v01-${{ matrix.year }}
          path: AEGIS_BACKTEST/
          retention-days: 30
          if-no-files-found: warn
