name: TITAN NSE live quote 27 Oct close verification
on:
  push:
    branches: [titan-nse-27oct-postmarket-data-probe]
permissions:
  contents: read
jobs:
  live-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query official NSE session close for frozen names
        run: |
          python - <<'PY'
          import requests,json,datetime,time
          from urllib.parse import quote
          ss=requests.Session();ss.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36','Accept':'application/json,text/plain,*/*','Accept-Language':'en-US,en;q=0.9','Referer':'https://www.nseindia.com/'})
          try:
            r=ss.get('https://www.nseindia.com/',timeout=12)
            print('NSE home',r.status_code)
          except Exception as e:print('NSE home error',str(e)[:120])
          out={"retrieved_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"quotes":{}}
          for symbol in "SONACOMS DALBHARAT TATACONSUM SSWL RECLTD AEQUS MANKIND APOLLO E2E ITCHOTELS PAYTM NAZARA TMCV ATHERENERG NETWEB AUBANK INFY CYIENT CASTROLIND KEC IGIL SEPC IDFCFIRSTB".split():
            try:
              r=ss.get('https://www.nseindia.com/api/quote-equity?symbol='+quote(symbol),timeout=10)
              d=r.json() if r.status_code==200 else {}
              p=d.get('priceInfo',{})
              out['quotes'][symbol]={"http":r.status_code,"lastUpdateTime":d.get("metadata",{}).get("lastUpdateTime"),"close":p.get("close"),"previousClose":p.get("previousClose"),"lastPrice":p.get("lastPrice"),"open":p.get("open"),"intraDayHighLow":p.get("intraDayHighLow"),"isin":d.get("metadata",{}).get("isin"),"series":d.get("metadata",{}).get("series")}
            except Exception as e:out['quotes'][symbol]={"error":str(e)[:120]}
          try:
            r=ss.get('https://www.nseindia.com/api/allIndices',timeout=12)
            d=r.json() if r.status_code==200 else {}
            out["index_http"]=r.status_code
            out["index_nifty50"]=[x for x in d.get("data",[]) if x.get("index")=="NIFTY 50"][:1]
          except Exception as e:out["index_error"]=str(e)[:200]
          with open("nse_live_quote_27oct.json","w") as f:json.dump(out,f,indent=2)
          print("TITAN_LIVE_QUOTES_START")
          print(json.dumps(out,separators=(",",":")))
          print("TITAN_LIVE_QUOTES_END")
          PY
      - name: Preserve live quote diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-nse-27oct-live-quotes
          path: nse_live_quote_27oct.json
          retention-days: 1
