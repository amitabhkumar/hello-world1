name: AEGIS 2026 extended robustness report
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis-2026-robustness.yml'
      - 'aegis/report_upstox_2026.py'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'duckdb>=1.2,<2'
      - name: Retrieve executed candle trade ledgers (not raw private market ZIP)
        uses: actions/download-artifact@v4
        with:
          run-id: 42252130058
          name: aegis-upstox-2026-stitch-and-replay
          path: INPUT
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Aggregate 2026 caveats, tail risk and cost stress
        run: python -m aegis.report_upstox_2026 --input INPUT/AEGIS_2026_EXTENSION
      - name: Publish executed robustness research results
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS_2026_EXTENDED_EXECUTED_ROBUSTNESS
          path: AEGIS_2026_ROBUSTNESS/
          retention-days: 90
