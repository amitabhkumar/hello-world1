name: AEGIS 2.0 input Greek OI option-market schema audit
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis20-schema-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'duckdb>=1.2,<2' 'pyarrow>=17,<24'
      - name: Fetch one pinned pre-CAS NIFTY options market source for actual fields
        run: python aegis/download_intraday_one.py --year 2025
      - uses: actions/download-artifact@v4
        with:
          run-id: 42331212071
          name: AEGIS_2026_FINAL_VERIFIED_OPTIONS_FUTURES_PARQUET
          path: PATCH
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report live-in-source 1-minute option OHLC OI volume schema and 10-06 coverage
        run: |
          python - <<'PY'
          import duckdb,json,pyarrow.parquet as pq
          db=duckdb.connect()
          sources={
             "2025":"AEGIS_INTRADAY_2025/NIFTY_2025.parquet",
             "2026_active":"PATCH/NIFTY_2026_active_options_patch.parquet"}
          for label,path in sources.items():
             schema=str(pq.read_schema(path))
             print("AEGIS20_OPTION_SCHEMA",label,schema[:3500],flush=True)
             cols=set(pq.read_schema(path).names)
             print("AEGIS20_COLUMNS",label,sorted(cols),flush=True)
             f="open_interest" if "open_interest" in cols else ("oi" if "oi" in cols else None)
             v="volume" if "volume" in cols else None
             if not f:continue
             result=db.execute(f"""
               SELECT COUNT(*) n,
                 COUNT(*) FILTER(WHERE TRY_CAST({f} AS DOUBLE)>0) positive_oi,
                 COUNT(*) FILTER(WHERE TRY_CAST({v} AS DOUBLE)>0) positive_volume,
                 approx_quantile(TRY_CAST({f} AS DOUBLE), .50) median_oi,
                 approx_quantile(TRY_CAST({f} AS DOUBLE), .95) p95_oi,
                 MIN(CAST(date AS VARCHAR)) first_date,
                 MAX(CAST(date AS VARCHAR)) last_date
               FROM read_parquet('{path}')""").fetchone()
             print("AEGIS20_SOURCE_STATS",label,json.dumps(result,default=str),flush=True)
             ts="timestamp"
             q=db.execute(f"""SELECT strftime({ts},'%H:%M') as trade_minute,
               COUNT(*) n,COUNT(*) FILTER(WHERE TRY_CAST({f} AS DOUBLE)>0) positive_oi,
               COUNT(*) FILTER(WHERE TRY_CAST({v} AS DOUBLE)>0) positive_volume
               FROM read_parquet('{path}')
               WHERE strftime({ts},'%H:%M') IN ('10:06','10:05','10:16','14:46')
               GROUP BY 1 ORDER BY 1""").fetchall()
             print("AEGIS20_OPTION_TIMES",label,json.dumps(q,default=str),flush=True)
          PY
