name: SOP 30-Day Math & Ledger Reconciliation (Test)

on:
  workflow_dispatch:

jobs:
  audit-30d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: Run 30-day test audit into Market_Data/Audit_30D_Test
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_INCOMING_FOLDER_ID: ${{ secrets.GDRIVE_INCOMING_FOLDER_ID }}
        run: python -u titan/sop_audit_30d.py
      - uses: actions/upload-artifact@v4
        with:
          name: audit-30d-test
          path: audit_30d_output/
