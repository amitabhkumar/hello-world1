name: AEGIS Upstox V3 historical transport probe
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis-upstox-v3-transport-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: One unauthenticated GET to documented historical candle URL
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json,time
          cases=[
            ("official_example","NSE_EQ%7CINE848E01016","2025-01-02","2025-01-01"),
            ("nifty_index","NSE_INDEX%7CNifty%2050","2026-11-05","2026-11-04")
          ]
          for label,key,end,start in cases:
              url=f"https://api.upstox.com/v3/historical-candle/{key}/minutes/1/{end}/{start}"
              req=urllib.request.Request(url,headers={"Accept":"application/json",
                    "User-Agent":"AEGIS-Transport-Probe/1.0"},method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=20) as res:
                      data=json.loads(res.read().decode("utf-8"))
                      bars=data.get("data",{}).get("candles",[])
                      print("UPSTOX_UNAUTH_PROBE",json.dumps({"case":label,"http_status":res.status,
                         "response_status":data.get("status"),
                         "bar_count":len(bars) if isinstance(bars,list) else -1}),flush=True)
              except urllib.error.HTTPError as e:
                  print("UPSTOX_UNAUTH_PROBE",json.dumps({"case":label,"http_status":e.code}),flush=True)
              except Exception as e:
                  reason=e.reason if isinstance(e,urllib.error.URLError) else e
                  print("UPSTOX_UNAUTH_PROBE",json.dumps({"case":label,
                         "error_type":type(reason).__name__,"errno":getattr(reason,"errno",None)}),flush=True)
          PY
