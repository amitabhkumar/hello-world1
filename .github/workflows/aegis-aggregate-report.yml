name: AEGIS consolidate verified option-candle backtest v0.1
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis-aggregate-report.yml'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'duckdb>=1.2,<2'
      - name: Load three executed and validated base-result ledgers
        uses: actions/download-artifact@v4
        with:
          run-id: 42184980037
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: aegis-backtest-v01-*
          merge-multiple: true
          path: INPUT
      - name: Compute bootstrap, matched cost stress and per-trade outputs
        run: python -m aegis.aggregate_report
      - name: Save complete report for Drive delivery
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS_EXECUTED_REPORT_2024_2026_v01
          path: AEGIS_REPORT/
          retention-days: 90
