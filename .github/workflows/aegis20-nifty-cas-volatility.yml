name: AEGIS 2.0 actual NIFTY CAS range and India VIX research
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis20-nifty-cas-volatility.yml'
      - 'aegis/aegis20_cas_index_audit.py'
  workflow_dispatch:
jobs:
  audit-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - uses: actions/download-artifact@v4
        with:
          run-id: 42332475921
          name: AEGIS_2026_COMPLETE_INDIA_VIX_RESEARCH_CONTEXT
          path: VIX
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch 2026 NIFTY index OHLC minute candles via read-only public V3
        run: |
          python -m py_compile aegis/aegis20_cas_index_audit.py
          python aegis/aegis20_cas_index_audit.py \
            --vix-file VIX/vix_2026.csv \
            --out AEGIS20_CAS_INDEX
      - name: Check no missing CAS cohort and source timestamps
        run: |
          python - <<'PY'
          import json,pathlib,pandas as pd
          root=pathlib.Path("AEGIS20_CAS_INDEX")
          e=json.loads((root/"AEGIS20_CAS_VOLATILITY_EVIDENCE.json").read_text())
          d=pd.read_csv(root/"AEGIS20_NIFTY_2026_DAILY_MOVEMENT.csv")
          assert e["distinct_sessions"]>=200,e
          assert e["post_CAS_AugNov2026"]["days"]>50,e
          assert e["pre_CAS_2026"]["days"]>100,e
          assert e["invalid_rows"]==0
          assert len(d)==e["distinct_sessions"]
          assert all((d["range_points"]>=0) & (d["range_points"]<2500)),e
          print("AEGIS20_CAS_NIFTY_RANGE_VIX_COHT_VALIDATED",json.dumps({
             "pre_CAS":e["pre_CAS_2026"],"post_CAS":e["post_CAS_AugNov2026"],
             "vix":e["by_vix_regime"]}),flush=True)
          PY
      - name: Archive all minute-source SHA evidence and daily ranges
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS20_CAS_INDEX_2026_REALIZED_VIX_REGIME_COMPARISON
          path: AEGIS20_CAS_INDEX/
          retention-days: 90
