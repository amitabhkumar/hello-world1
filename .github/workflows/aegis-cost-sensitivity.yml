name: AEGIS NIFTY execution-cost sensitivity
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis-cost-sensitivity.yml'
  workflow_dispatch:
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
        slippage: ["0.0025", "0.0150"]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'duckdb>=1.2,<2' 'pandas>=2.1,<3' 'numpy>=1.26,<3' 'pyarrow>=17,<24'
      - uses: actions/download-artifact@v4
        with:
          name: aegis-nifty-intraday-${{ matrix.year }}
          run-id: 42155340491
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: OPTIONS
      - uses: actions/download-artifact@v4
        with:
          name: aegis-market-context
          run-id: 42183687184
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: SUPPORT
      - name: Run slippage sensitivity
        shell: bash
        env:
          AEGIS_SLIP_PCT: ${{ matrix.slippage }}
        run: |
          set -euo pipefail
          FILE="OPTIONS/NIFTY_${{ matrix.year }}.parquet"
          if [[ ! -f "$FILE" ]]; then FILE="OPTIONS/upstox_intraday/NIFTY/NIFTY_${{ matrix.year }}.parquet"; fi
          python aegis/backtest_v01.py --year ${{ matrix.year }} --parquet "$FILE" --support SUPPORT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-stress-${{ matrix.year }}-${{ matrix.slippage }}
          path: AEGIS_BACKTEST/
          retention-days: 30
