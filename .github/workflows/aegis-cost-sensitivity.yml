name: AEGIS NIFTY execution-cost sensitivity
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis-cost-sensitivity.yml'
  workflow_dispatch:
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026]
        slippage: ["0.0025", "0.0150"]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'duckdb>=1.2,<2' 'pandas>=2.1,<3' 'numpy>=1.26,<3' 'pyarrow>=17,<24'
      - name: Fetch checksum-verified public options
        run: python aegis/download_intraday_one.py --year ${{ matrix.year }}
      - name: Fetch checksum-verified spot, futures and VIX
        run: python aegis/download_market_context.py
      - name: Run slippage sensitivity
        shell: bash
        env:
          AEGIS_SLIP_PCT: ${{ matrix.slippage }}
        run: |
          set -euo pipefail
          FILE="AEGIS_INTRADAY_${{ matrix.year }}/NIFTY_${{ matrix.year }}.parquet"
          test -s "$FILE"
          python aegis/backtest_v01.py --year ${{ matrix.year }} --parquet "$FILE" --support AEGIS_SUPPORT
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-stress-${{ matrix.year }}-${{ matrix.slippage }}
          path: AEGIS_BACKTEST/
          retention-days: 30
