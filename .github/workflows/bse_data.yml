name: BSE supplementary datasets
on:
  push:
    paths: ['titan/bse_data.py', 'titan/bse_details.py', 'tests/test_bse_data.py', '.github/workflows/bse_data.yml', 'titan/data_run_requests/**']
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Requested report date YYYY-MM-DD; snapshots retain their actual source date'
        type: string
        required: false
      resume_run_id:
        description: 'Completed BSE supplementary run whose exact original ownership files may be reused'
        type: string
        required: false
      datasets:
        description: 'all or comma-separated dataset IDs from titan/bse_data.py'
        type: string
        default: all
  schedule:
    - cron: '0 3 * * 1-5'
    - cron: '0 11 * * 1-5'
    - cron: '30 16 * * *'
    - cron: '30 2 * * 6'
permissions:
  contents: read
  actions: read
concurrency:
  group: bse-supplementary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore immutable original-filings cache
        uses: actions/cache/restore@v4
        with:
          path: bse_original_cache
          key: bse-originals-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bse-originals-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: pip install -r requirements-bse.txt
      - run: python -m playwright install --with-deps chromium
      - name: Resolve optional saved-artifact continuation
        env:
          REQUESTED_RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          python - <<'PYCODE'
          import os,json,re
          from pathlib import Path
          value=os.getenv('REQUESTED_RESUME_RUN','')
          if not value and os.getenv('GITHUB_EVENT_NAME')=='push':
              event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
              match=re.search(r'\[bse-data-resume=(\d+)\]',(event.get('head_commit') or {}).get('message',''))
              if match:value=match.group(1)
          if value and not value.isdigit():raise ValueError('Invalid resume run ID')
          if value:
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  out.write('BSE_RESUME_RUN_ID='+value+'\nBSE_RESUME_DIRECTORY=bse_resume\n')
          elif Path('bse_original_cache/shareholding/shareholding_one_year.json').exists():
              origin=json.load(open('bse_original_cache/source_run.json'))['run_id']
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  out.write('BSE_RESUME_DIRECTORY=bse_original_cache\nBSE_CACHE_SOURCE_RUN_ID='+str(origin)+'\n')
          PYCODE
      - name: Restore completed artifact for immutable-original reuse
        if: env.BSE_RESUME_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: bse-data-${{ env.BSE_RESUME_RUN_ID }}-1
          path: bse_resume
          run-id: ${{ env.BSE_RESUME_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Collect each dataset with explicit status
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          BSE_DIAGNOSTIC_SINGLE_PASS: ${{ github.event_name == 'workflow_dispatch' && inputs.datasets == 'announcements,pledges' && '1' || '0' }}
          DATASETS: ${{ inputs.datasets }}
        shell: bash
        run: |
          args=(--datasets "${DATASETS:-all}")
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          xvfb-run --auto-servernum python -m titan.bse_data "${args[@]}"
      - name: Prepare verified originals for next unattended run
        if: always()
        id: originals
        run: |
          python - <<'PYCODE'
          import os,json,shutil,hashlib
          from pathlib import Path
          source=Path('bse_data_output/shareholding')
          receipts=source/'ownership_receipts.json'
          if receipts.exists():
              rows=json.loads(receipts.read_text())
              cache=Path('bse_original_cache')
              if cache.exists():shutil.rmtree(cache)
              dest=cache/'shareholding';dest.mkdir(parents=True)
              shutil.copy2(source/'shareholding_one_year.json',dest/'shareholding_one_year.json')
              kept=[]
              for row in rows:
                  f=source/row['file']
                  if not f.exists() or hashlib.sha256(f.read_bytes()).hexdigest()!=row['sha256']:continue
                  shutil.copy2(f,dest/f.name);kept.append(row)
              (dest/'ownership_receipts.json').write_text(json.dumps(kept))
              (cache/'source_run.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'count':len(kept)}))
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('ready=true\n')
          PYCODE
      - name: Save immutable originals for unattended reuse
        if: always() && steps.originals.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: bse_original_cache
          key: bse-originals-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Optional verified Drive handoff
        if: always()
        continue-on-error: true
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_INCOMING_FOLDER_ID: ${{ secrets.GDRIVE_INCOMING_FOLDER_ID }}
          GDRIVE_LOGS_FOLDER_ID: ${{ secrets.GDRIVE_LOGS_FOLDER_ID }}
        run: |
          if [ -n "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            python3 -m venv /tmp/titan-drive-venv
            /tmp/titan-drive-venv/bin/pip install google-auth==2.40.3 requests==2.32.4
            /tmp/titan-drive-venv/bin/python -m titan.drive_sync --root bse_data_output
          else
            python3 -m titan.drive_sync --root bse_data_output
          fi
      - name: Deliver and verify via Drive OAuth
        if: always()
        continue-on-error: true
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_INCOMING_FOLDER_ID: ${{ secrets.GDRIVE_INCOMING_FOLDER_ID }}
        uses: ./.github/actions/drive-oauth
        with:
          root: bse_data_output
      - name: Preserve all successes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: bse_data_output/
          if-no-files-found: error
          retention-days: 90


