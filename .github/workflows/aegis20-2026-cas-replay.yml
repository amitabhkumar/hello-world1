name: AEGIS 2.0 Greece VIX OI 2026 pre-post CAS replay
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis20-2026-cas-replay.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate ephemeral audit-runner RSA key and announce public modulus
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/aegis-private.pem 2>/dev/null
          openssl pkey -in /tmp/aegis-private.pem -pubout -out /tmp/aegis-public.pem
          openssl rsa -pubin -in /tmp/aegis-public.pem -modulus -noout | sed 's/^Modulus=/AEGIS_RSA_MODULUS=/'
          echo 'PRIVATE KEY IS IN THE RUNNER ONLY'
      - name: Publish ephemeral public modulus, never the private key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os,subprocess,base64,json,urllib.request
          raw=subprocess.check_output(["openssl","rsa","-pubin","-in","/tmp/aegis-public.pem","-modulus","-noout"],text=True)
          modulus=raw.strip().split("=",1)[1]
          payload=json.dumps({"run_id":os.environ["GITHUB_RUN_ID"],"modulus_hex":modulus,
              "exponent":65537,"scheme":"RSA-PKCS1v1_5-ephemeral"})
          encoded=base64.b64encode(payload.encode()).decode()
          body=json.dumps({"message":"Ephemeral public key for encrypted market-data handoff",
               "content":encoded,"branch":"aegis-nifty-backtest"})
          path="aegis/_private_handoff/pubkey_"+os.environ["GITHUB_RUN_ID"]+".json"
          url="https://api.github.com/repos/amitabhkumar/hello-world1/contents/"+path
          req=urllib.request.Request(url,data=body.encode(),method="PUT",
                headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as res:
              print("Ephemeral public key published:",path,flush=True)
          PY
      - name: Receive privately encrypted one-use historical option ZIP links
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,subprocess,time,urllib.request,urllib.error
          from urllib.parse import urlparse
          endpoint="https://api.github.com/repos/amitabhkumar/hello-world1/contents/aegis/_private_handoff/aegis20-2026.enc.json?ref=aegis-nifty-backtest"
          for attempt in range(120):
              try:
                  req=urllib.request.Request(endpoint,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                    "Accept":"application/vnd.github.raw+json","Cache-Control":"no-cache","User-Agent":"AEGIS20-Source-Reader"})
                  with urllib.request.urlopen(req,timeout=25) as res:
                      payload=json.loads(res.read().decode("utf-8"))
                  if payload.get("blobs"):break
              except (urllib.error.HTTPError,urllib.error.URLError,ValueError):
                  pass
              time.sleep(5)
          else:raise SystemExit("AEGIS20 encrypted market-data handoff absent")
          if payload.get("scheme")!="RSA-PKCS1v1_5-ephemeral" or payload.get("run_id")!=os.environ["GITHUB_RUN_ID"]:
              raise SystemExit("AEGIS20 one-time RSA handoff mismatch")
          for name,dest,low,hi in [
             ("original","AEGIS_Upstox_Export.zip",95000000,97000000),
             ("active","AEGIS_Upstox_Active_Patch.zip",4500000,5500000)]:
              blocks=payload["blobs"].get(name)
              if not isinstance(blocks,list) or not 1<=len(blocks)<=8:
                  raise SystemExit("Invalid encrypted market archive descriptor")
              clear=[]
              for hextext in blocks:
                  out=subprocess.run(["openssl","pkeyutl","-decrypt","-inkey","/tmp/aegis-private.pem",
                    "-pkeyopt","rsa_padding_mode:pkcs1"],input=bytes.fromhex(hextext),
                    stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
                  clear.append(out.stdout)
              signed_url=b"".join(clear).decode("utf-8")
              parts=urlparse(signed_url)
              if parts.scheme!="https" or not parts.hostname or not parts.hostname.endswith(".oaiusercontent.com"):
                  raise SystemExit("Unsupported market archive temporary download host")
              req=urllib.request.Request(signed_url,headers={"User-Agent":"AEGIS20-Historical-Research/1"})
              length=0
              with urllib.request.urlopen(req,timeout=180) as stream,open(dest,"wb") as out:
                  while True:
                      chunk=stream.read(1024*1024)
                      if not chunk:break
                      length+=len(chunk);out.write(chunk)
              if not low<=length<=hi:
                  raise SystemExit("Unexpected ZIP bytes "+name+" "+str(length))
              print("AEGIS20_ORIGINAL_SOURCE_IMPORTED",name,length,flush=True)
          PY
      - name: Verify no alteration of private Upstox historical source market ZIP
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("AEGIS_Upstox_Export.zip")
          digest=hashlib.sha256(root.read_bytes()).hexdigest()
          wanted="67ae9d3345d2f9a7ab73fd7fd0a0a71894c7724c34b4e41e985372002a5e52e6"
          assert digest==wanted,("Original historical data changed",digest)
          print("AEGIS20_SOURCE_SHA256_PASSED",digest,flush=True)
          PY
          python aegis/audit_active_patch.py --patch AEGIS_Upstox_Active_Patch.zip --out AEGIS20_active_source_audit.json
      - name: Install numerical + Parquet historical strategy dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'pyarrow>=17,<24' 'duckdb>=1.2,<2'
      - name: Retrieve previously-pinned public NIFTY 2026 option candles
        run: python aegis/download_intraday_one.py --year 2026
      - name: Retrieve source-verified five-minute NIFTY index and futures proxy
        run: python aegis/download_market_context.py
      - name: Stitch user derivative ZIPs and 2026 cash-index market signals
        run: |
          python aegis/stitch_upstox_2026.py --zip AEGIS_Upstox_Export.zip --support AEGIS_SUPPORT --output AEGIS_STITCH
          python -m aegis.stitch_active_patch --zip AEGIS_Upstox_Active_Patch.zip --output AEGIS_STITCH
      - uses: actions/download-artifact@v4
        with:
          run-id: 42332475921
          name: AEGIS_2026_COMPLETE_INDIA_VIX_RESEARCH_CONTEXT
          path: VIX_COMPLETE
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use verified ALL-YEAR India VIX 2026 before selecting any option strategy
        run: |
          cp VIX_COMPLETE/vix_2026.csv AEGIS_SUPPORT/vix_2026.csv
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("VIX_COMPLETE/AEGIS_VIX_2026_DATA_QUALITY.json").read_text())
          assert r["distinct_sessions"]==209 and r["valid_minute_records"]==78375
          assert r["token_used"] is False
          print("AEGIS20_FULL_PRIOR_DAY_VIX_VERIFIED",r["distinct_sessions"],flush=True)
          PY
      - name: Execute THREE identical frozen Greek-IV-OI-VIX families on pre/post CAS 2026
        env:
          TZ: Asia/Kolkata
        run: |
          python -m aegis.aegis20_candidates --year 2026 \
            --parquet "AEGIS_INTRADAY_2026/NIFTY_2026.parquet;AEGIS_STITCH/NIFTY_upstox_2026_jul_nov.parquet;AEGIS_STITCH/NIFTY_2026_active_options_patch.parquet" \
            --support AEGIS_SUPPORT --out AEGIS20_2026
      - name: Verify source timing, Greeks and post-CAS cohort segregation
        run: |
          python - <<'PY'
          import json,pandas as pd,pathlib
          root=pathlib.Path("AEGIS20_2026")
          r=json.loads((root/"AEGIS20_summary_2026.json").read_text())
          t=pd.read_csv(root/"AEGIS20_candidates_2026.csv")
          assert r["year"]==2026 and r["deduplicated_source_rows"]>=0,r
          assert r["option_quote_dates"]>50,r
          assert r["post_CAS_range"]==["2026-08-03","2026-11-05"]
          if not t.empty:
              assert t.vix.notna().all()
              assert t.atm_iv_pct.notna().all()
              assert all(t.vix_prior_date.astype(str)<t.date.astype(str))
              assert all(t.max_loss_rs<=12500.01)
              assert (t.sum_oi>0).all()
              assert set(t.entry_time)=={"10:16"}
              assert set(t.exit_time)=={"14:46"}
          print("AEGIS20_CAS_EXPLORATORY_REPLAY_VERIFIED",json.dumps({
             "source_days":r["option_quote_dates"],"strat_results":r["family_results"],
             "post_CAS":r["family_by_regime"]},default=str),flush=True)
          PY
      - name: Archive all three 2026 CAS candidate strategy ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS20_CAS_2026_IV_GREEKS_OI_VIX_CANDIDATES
          path: |
            AEGIS20_2026/
            AEGIS_STITCH/ingestion_report.json
            AEGIS_STITCH/active_patch_ingestion.json
            AEGIS20_active_source_audit.json
            AEGIS_INTRADAY_2026/ingest_manifest.json
            VIX_COMPLETE/AEGIS_VIX_2026_DATA_QUALITY.json
          if-no-files-found: warn
          retention-days: 90
