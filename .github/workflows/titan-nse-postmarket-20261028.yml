name: TITAN 28 Oct official NSE postmarket UDiFF acquisition
on:
  push:
    branches: [titan-nse-postmarket-20261028]
permissions:
  contents: read
jobs:
  nse-udiff:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download and validate official NSE 28 October cash market files
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,zipfile,io,csv,json,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          Path('output').mkdir(exist_ok=True)
          targets=[
            ('NSE_UDIFF','https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_20261028_F_0000.csv.zip','BhavCopy_NSE_CM_0_0_0_20261028_F_0000.csv'),
            ('NSE_SEC','https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_28102026.csv','sec_bhavdata_full_28102026.csv'),
          ]
          results=[]
          for label,url,expected in targets:
              info={'label':label,'url':url,'expected_filename':expected,'retrieved_utc':datetime.now(timezone.utc).isoformat(),'status':'FAILED'}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
                  with urllib.request.urlopen(req,timeout=35) as resp:
                      raw=resp.read(15000000)
                      info['http_status']=resp.status
                  if raw[:2]==b'PK':
                      with zipfile.ZipFile(io.BytesIO(raw)) as z:
                          names=z.namelist()
                          info['zip_members']=names
                          matches=[n for n in names if n.rsplit('/',1)[-1].lower()==expected.lower()]
                          if len(matches)!=1:raise ValueError('Expected exact member missing')
                          raw=z.read(matches[0])
                  decoded=raw.decode('utf-8-sig')
                  reader=csv.DictReader(io.StringIO(decoded))
                  cols=reader.fieldnames or []
                  rows=list(reader)
                  if label=='NSE_UDIFF':
                      required=['TradDt','Sgmt','Src','FinInstrmTp','ISIN','TckrSymb','SctySrs','OpnPric','HghPric','LwPric','ClsPric','PrvsClsgPric','TtlTradgVol']
                      missing=[c for c in required if c not in cols]
                      if missing:raise ValueError('missing columns '+str(missing))
                      date_values={r['TradDt'] for r in rows}
                      src_values={r['Src'] for r in rows}
                      seg_values={r['Sgmt'] for r in rows}
                      if not date_values or len(date_values)!=1 or not all('2026' in d and ('10' in d or 'Oct' in d) and '28' in d for d in date_values):raise ValueError('wrong dates '+str(date_values))
                      if src_values!={'NSE'} or seg_values!={'CM'}:raise ValueError('wrong source or segment '+str(src_values)+str(seg_values))
                      info.update({'dates':list(date_values),'sources':list(src_values),'segments':list(seg_values)})
                  else:
                      datecol=next((x for x in ['DATE1','DATE','Date'] if x in cols),None)
                      if not datecol:raise ValueError('sec date column missing')
                      date_values={r[datecol] for r in rows}
                      if len(date_values)!=1 or not all('28' in d and '2026' in d for d in date_values):raise ValueError('wrong sec date '+str(date_values))
                      info['dates']=list(date_values)
                  if not rows:raise ValueError('zero rows')
                  out=Path('output')/expected
                  out.write_bytes(raw)
                  info.update({'status':'VALIDATED','rows':len(rows),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'columns':cols,'saved_name':expected})
              except urllib.error.HTTPError as e:
                  info.update({'status':'HTTP_ERROR','http_status':e.code,'error':str(e)})
              except Exception as e:
                  info.update({'status':'ERROR','error':str(e)[:400]})
              results.append(info)
              print(json.dumps(info)[:1200],flush=True)
          manifest={'target_session':'2026-10-28','generated_utc':datetime.now(timezone.utc).isoformat(),'files':results}
          Path('output/manifest.json').write_text(json.dumps(manifest,indent=2))
          if not any(x['status']=='VALIDATED' and x['label']=='NSE_UDIFF' for x in results):raise SystemExit('NSE UDiFF not yet validated')
          PY
      - name: Upload validated file and acquisition receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-nse-28oct
          path: output/
          retention-days: 7
