name: AEGIS consolidate already-executed 2024-2026 ledgers
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis-two-year-consolidate-only.yml'
  workflow_dispatch:
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'duckdb>=1.2,<2'
      - uses: actions/download-artifact@v4
        with:
          run-id: 42331919962
          name: AEGIS_2024_2026_REPLAY_2024
          path: YEAR_2024
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 42331919962
          name: AEGIS_2024_2026_REPLAY_2025
          path: YEAR_2025
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 42273407619
          name: AEGIS_2026_ACTIVE_PATCH_FULL_INTEGRATED_EVIDENCE
          path: YEAR_2026
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Aggregate corrected rolling research evidence
        run: |
          python -m aegis.rolling_research_final \
            --y2024 YEAR_2024 --y2025 YEAR_2025 --y2026 YEAR_2026 \
            --out AEGIS_TWO_YEAR_COMPLETE
      - name: Upload final 2024–2026 risk/robustness documentation and ledgers
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS_NIFTY_2024_2026_EXECUTED_COMPLETE_RESEARCH
          path: |
            AEGIS_TWO_YEAR_COMPLETE/
            YEAR_2024/AEGIS_BACKTEST_2024/
            YEAR_2025/AEGIS_BACKTEST_2025/
            YEAR_2024/AEGIS_INTRADAY_2024/ingest_manifest.json
            YEAR_2025/AEGIS_INTRADAY_2025/ingest_manifest.json
          retention-days: 90
