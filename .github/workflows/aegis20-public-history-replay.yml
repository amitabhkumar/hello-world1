name: AEGIS 2.0 Greek-VIX-OI candidate baseline replays
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis20-public-history-replay.yml'
      - 'aegis/aegis20_candidates.py'
  workflow_dispatch:
jobs:
  one-year-candidate-competition:
    strategy:
      fail-fast: false
      matrix:
        year: [2024,2025]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'pyarrow>=17,<24' 'duckdb>=1.2,<2'
      - name: Validate option Greek formulas, risk cap and signal-time constraints
        run: |
          python -m py_compile aegis/aegis20_candidates.py
          python - <<'PY'
          import datetime as dt
          from aegis import aegis20_candidates as m
          from aegis.backtest_v01 import estimate_greeks
          x=estimate_greeks(24200,24200,7,"CE",175)
          y=estimate_greeks(24200,24200,7,"PE",175)
          assert x is not None and y is not None
          assert 0<x["delta"]<1 and -1<y["delta"]<0,(x,y)
          assert x["gamma"]>0 and x["vega_per_ivpt"]>0
          assert x["theta_per_day"]<0
          assert m.MAX_POSITION_LOSS==12500
          assert m.MIN_OPEN_INTEREST>0
          assert m.SESSION_BARS==("10:06","10:16","14:46")
          assert m.CAS_START==dt.date(2026,8,3)
          assert m.DEC_CAS_CHANGE==dt.date(2026,12,7)
          print("AEGIS20_GREEKS_IV_OI_VIX_RISK_INPUT_TEST_PASSED")
          PY
      - name: Fetch SHA-256 pinned one-minute NIFTY options source
        run: python aegis/download_intraday_one.py --year ${{ matrix.year }}
      - name: Fetch independent cash-index 5m and prior-session India VIX inputs
        run: python aegis/download_market_context.py
      - name: Execute three *frozen* option strategy hypotheses, no grid tuning
        run: |
          python -m aegis.aegis20_candidates --year ${{ matrix.year }} \
            --parquet AEGIS_INTRADAY_${{ matrix.year }}/NIFTY_${{ matrix.year }}.parquet \
            --support AEGIS_SUPPORT --out AEGIS20_${{ matrix.year }}
          python - <<'PY'
          import os,json,pathlib,pandas as pd
          year=int(os.environ["AEGIS_TEST_YEAR"])
          root=pathlib.Path(f"AEGIS20_{year}")
          report=json.loads((root/f"AEGIS20_summary_{year}.json").read_text())
          ledger=pd.read_csv(root/f"AEGIS20_candidates_{year}.csv")
          assert report["year"]==year and report["option_quote_dates"]>30
          assert "RANGE_CREDIT" in report["family_results"]
          assert report["out_of_sample"] is False
          if not ledger.empty:
              assert all(ledger.max_loss_rs<=12500.01)
              assert all(ledger.entry_time=="10:16")
              assert all(ledger.exit_time=="14:46")
              assert all(ledger.min_leg_oi>=5000)
              assert all(ledger.vix_prior_date.astype(str)<ledger.date.astype(str))
              assert all(ledger.vega_rs_ivpt.notna())
              print("AEGIS20_TRADES_VALIDATED",len(ledger),flush=True)
          else:
              print("AEGIS20_NO_QUALIFIED_TRADES: strict risk/Greek/VIX/OI gates",flush=True)
          PY
        env:
          TZ: Asia/Kolkata
          AEGIS_TEST_YEAR: ${{ matrix.year }}
      - name: Archive AEGIS 2.0 quantitative research candidates and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS20_FROZEN_CANDIDATES_${{ matrix.year }}
          path: |
            AEGIS20_${{ matrix.year }}/
            AEGIS_INTRADAY_${{ matrix.year }}/ingest_manifest.json
          retention-days: 90
          if-no-files-found: warn
