name: AEGIS stitched Upstox data adapter QA
on:
  push:
    branches: [aegis-nifty-backtest]
    paths:
      - '.github/workflows/aegis-stitch-tests.yml'
      - 'aegis/stitch_upstox_2026.py'
  workflow_dispatch:
jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'pandas>=2.1,<3' 'pyarrow>=17,<24' 'duckdb>=1.2,<2'
      - name: Create a small synthetic ZIP with contract metadata and index candles
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json,zipfile,pathlib,io
          base=pathlib.Path("AEGIS_SUPPORT")
          base.mkdir(exist_ok=True)
          (base/"NIFTY_5min_5yr_2021_2026.csv").write_text(
            "timestamp,open,high,low,close,volume\n"
            "2026-04-21 09:15:00,20000,20010,19990,20005,100\n")
          def csvdata(start):
              return ("timestamp,open,high,low,close,volume,oi\n"
                 +start+",200,210,190,201,100,50\n").encode()
          with zipfile.ZipFile("smoke.zip","w",compression=zipfile.ZIP_DEFLATED) as z:
              for kind,exp,stem,typ,strike,ts in [
                ("options","2026-11-03","22750_CE","CE",22750,"2026-11-02T15:39:00+05:30"),
                ("futures","2026-10-27","FUT","FUT",None,"2026-10-27T15:39:00+05:30")]:
                  path=f"AEGIS_Upstox_Export/{kind}/{exp}/{stem}.csv"
                  raw=csvdata(ts)
                  z.writestr(path,raw)
                  z.writestr(path[:-4]+".json",json.dumps({
                    "expiry":exp,"strike_price":strike,"instrument_type":typ,"lot_size":65,
                    "sha256_csv":hashlib.sha256(raw).hexdigest()}))
              for name,date,px in [
                 ("NIFTY50","2026-07-22T09:15:00+05:30","22000"),
                 ("INDIA_VIX","2026-07-22T09:15:00+05:30","15")]:
                  raw=("timestamp,open,high,low,close,volume,oi\n"
                       +date+","+px+","+px+","+px+","+px+",100,0\n").encode()
                  z.writestr(f"AEGIS_Upstox_Export/indices/{name}/a.csv",raw)
          PY
          python -m py_compile aegis/stitch_upstox_2026.py aegis/backtest_v01.py
          python aegis/stitch_upstox_2026.py --zip smoke.zip
          python - <<'PY'
          import json,pyarrow.parquet as pq
          r=json.load(open("AEGIS_STITCH/ingestion_report.json"))
          assert r["option_rows_written"]==1, r
          assert r["futures_rows_written"]==1, r
          assert r["metadata_sha_verified"]==2,r
          table=pq.read_table("AEGIS_STITCH/NIFTY_upstox_2026_jul_nov.parquet")
          assert len(table)==1
          assert len(pq.read_table("AEGIS_STITCH/NIFTY_futures_upstox_2026.parquet"))==1
          assert r["index"]["vix_days"]==1
          print("AEGIS STITCH SMOKE TEST PASSED")
          PY
