name: AEGIS 3.0 failed-trade root-cause and fee audit
on:
  push:
    branches: [aegis-nifty-backtest]
    paths: ['.github/workflows/aegis3-root-cause-audit.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'pandas>=2.1,<3' 'numpy>=1.26,<3'
      - uses: actions/download-artifact@v4
        with:
          run-id: 42350347322
          name: AEGIS3_NIFTY_2024_2026_COMPLETE_FROZEN_CREDIT_RESEARCH
          path: INPUT
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Produce post-mortem breakdown without modifying historical trades
        run: |
          python - <<'PY'
          import json,os,pathlib,pandas as pd
          out=pathlib.Path("AEGIS3_RESEARCH_POSTMORTEM")
          out.mkdir(exist_ok=True)
          x=pd.read_csv("INPUT/AEGIS3_FINAL/AEGIS3_REPRODUCIBLE_TRADE_LEDGER_2024_2026.csv")
          r=json.loads(pathlib.Path("INPUT/AEGIS3_FINAL/AEGIS3_FINAL_RESEARCH_EVIDENCE.json").read_text())
          x["gross_before_fees"]=x.net_pnl_rs+x.charges_rs
          def summarize(frame):
              return {"n":len(frame),
                 "net_pnl_rs":round(float(frame.net_pnl_rs.sum()),2),
                 "gross_pre_fee_rs":round(float(frame.gross_before_fees.sum()),2),
                 "total_modeled_fees_rs":round(float(frame.charges_rs.sum()),2),
                 "median_gross_credit_points":round(float(frame.net_credit_pts.median()),2),
                 "median_fees_rs":round(float(frame.charges_rs.median()),2),
                 "win_rate":round(float((frame.net_pnl_rs>0).mean()),4)}
          report={"source":"FROZEN AEGIS3 22-trade verified OHLC proxy ledger",
            "complete":summarize(x),
            "by_exit_reason":{str(k):summarize(v) for k,v in x.groupby("exit_reason")},
            "by_spread_type":{str(k):summarize(v) for k,v in x.groupby("side")},
            "by_cas_regime":{str(k):summarize(v) for k,v in x.groupby("regime")},
            "negative_after_fees_but_gross_positive":int(((x.gross_before_fees>0)&(x.net_pnl_rs<=0)).sum()),
            "median_initial_credit_inr_before_charges":round(float((x.net_credit_pts*x.qty).median()),2),
            "mean_fees_rs":round(float(x.charges_rs.mean()),2),
            "median_worst_contract_loss_rs":round(float(x.contract_max_loss_est_rs.median()),2),
            "all_point_in_time_vix":bool((x.vix_prior_date.astype(str)<x.date.astype(str)).all()),
            "unexecutable_marks_exits":int(x.missing_exit_penalty.sum()),
            "interpretation":"Actual bid/ask, spreads and order queue unavailable. This is descriptive attribution, not post-hoc strategy tuning."}
          assert report["complete"]["n"]==22
          assert abs(report["complete"]["net_pnl_rs"]-r["metrics"]["all"]["net_pnl_rs"])<.01
          (out/"AEGIS3_ACTUAL_REPLAY_FAILURE_ATTRIBUTION.json").write_text(json.dumps(report,indent=2))
          print("AEGIS3_FAILURE_ATTRIBUTION",json.dumps(report,default=str),flush=True)
          PY
      - name: Save separate failure attribution for transparent negative result
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS3_DETAILED_MODEL_FAILURE_POSTMORTEM
          path: AEGIS3_RESEARCH_POSTMORTEM/
          retention-days: 90
