name: AEGIS 3.0 frozen directional credit 2024–2025 backtest
on:
  push:
    branches: [aegis-nifty-backtest]
    paths: ['.github/workflows/aegis3-credit-public.yml', 'aegis/aegis3_credit_spread.py']
  workflow_dispatch:
jobs:
  public-replay:
    strategy:
      fail-fast: false
      matrix:
        year: [2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'duckdb>=1.2,<2' 'pyarrow>=17,<24'
      - name: Check risk limits, 2026 CAS date and source code
        run: |
          python -m py_compile aegis/aegis3_credit_spread.py
          python - <<'PY'
          import datetime as dt
          from aegis import aegis3_credit_spread as m
          assert m.CAS_START==dt.date(2026,8,3)
          assert m.DEC_CAS_START==dt.date(2026,12,7)
          assert m.MAX_POSITION_RISK==10000
          assert m.MAX_DAILY_RISK==25000
          assert m.MAX_POSITIONS_PER_DAY==1
          assert m.TIMES[0]=="09:46" and "10:06" in m.TIMES
          assert m.CHECKS[-1]==("14:40","14:46")
          assert all(p>0 for p in m.SPREAD_WIDTHS)
          print("AEGIS3_FROZEN_RESEARCH_RULES_UNIT_CHECK_PASSED")
          PY
      - name: Download pinned public one-minute options
        run: python aegis/download_intraday_one.py --year ${{ matrix.year }}
      - name: Download SHA-verified NIFTY index, India VIX and futures context
        run: python aegis/download_market_context.py
      - name: Execute AEGIS 3 with observed historical OI and VIX
        env:
          TZ: Asia/Kolkata
          AEGIS_YEAR: ${{ matrix.year }}
        run: |
          python -m aegis.aegis3_credit_spread \
            --year ${{ matrix.year }} \
            --parquet AEGIS_INTRADAY_${{ matrix.year }}/NIFTY_${{ matrix.year }}.parquet \
            --support AEGIS_SUPPORT --out AEGIS3_${{ matrix.year }}
          python - <<'PY'
          import os,json,pathlib
          year=int(os.environ["AEGIS_YEAR"])
          f=pathlib.Path(f"AEGIS3_{year}/AEGIS3_summary_{year}.json")
          s=json.loads(f.read_text())
          assert s["year"]==year and s["option_quote_dates"]>25
          assert s["model_risk_limit_rs"]==10000
          assert s["prospective_unseen_holdout"] is False
          print("AEGIS3_YEAR_QA",json.dumps({
            "year":year,"results":s["strategy_results"],
            "risk":s["model_risk_limit_rs"],
            "missing_exit":s["conservatively_penalized_missing_exits"],
            "skips":s["skip_reasons"]}),flush=True)
          PY
      - name: Preserve executed candidate ledger and sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS3_FROZEN_CREDIT_${{ matrix.year }}
          path: |
            AEGIS3_${{ matrix.year }}/
            AEGIS_INTRADAY_${{ matrix.year }}/ingest_manifest.json
          if-no-files-found: warn
          retention-days: 90
