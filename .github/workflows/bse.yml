name: BSE Bhavcopy
on:
  push:
    paths: ['titan/**', 'tests/**', 'requirements-bse.txt', '.github/workflows/bse.yml']
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Optional exact report date YYYY-MM-DD'
        type: string
        required: false
  schedule:
    # SOP starts in IST: 08:30 weekdays, 16:30 weekdays, 22:00 daily, Saturday 08:00.
    - cron: '0 3 * * 1-5'
    - cron: '0 11 * * 1-5'
    - cron: '30 16 * * *'
    - cron: '30 2 * * 6'
permissions:
  contents: read
concurrency:
  group: bse-bhavcopy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  download:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[bse-live]')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-bse.txt
      - run: python -m playwright install --with-deps chromium
      - name: Download and validate BSE file
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        shell: bash
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          xvfb-run --auto-servernum python -m titan.bse "${args[@]}"
      - name: Optional verified Drive handoff
        if: always()
        continue-on-error: true
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_INCOMING_FOLDER_ID: ${{ secrets.GDRIVE_INCOMING_FOLDER_ID }}
          GDRIVE_LOGS_FOLDER_ID: ${{ secrets.GDRIVE_LOGS_FOLDER_ID }}
        run: |
          if [ -n "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            python3 -m venv /tmp/titan-drive-venv
            /tmp/titan-drive-venv/bin/pip install google-auth==2.40.3 requests==2.32.4
            /tmp/titan-drive-venv/bin/python -m titan.drive_sync --root output
          else
            python3 -m titan.drive_sync --root output
          fi
      - name: Deliver and verify via Drive OAuth
        if: always()
        continue-on-error: true
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_INCOMING_FOLDER_ID: ${{ secrets.GDRIVE_INCOMING_FOLDER_ID }}
        uses: ./.github/actions/drive-oauth
        with:
          root: output
      - name: Preserve result and status for authorized Drive handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bse-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 7


