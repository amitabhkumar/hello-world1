name: AEGIS repaired October futures Parquet reconciliation
on:
  push:
    branches: [aegis-nifty-backtest]
    paths: ['.github/workflows/aegis-futures-parquet-reconcile.yml']
  workflow_dispatch:
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'pandas>=2.1,<3' 'pyarrow>=17,<24'
      - name: Recover the verified repaired ZIP from successful historical public data run
        uses: actions/download-artifact@v4
        with:
          run-id: 42330977469
          name: AEGIS_NIFTY_2026_OCT_FUTURES_VERIFIED_REPAIR
          path: INPUT
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Import repaired market-data ZIP to 1m options/futures Parquet without API access
        run: |
          python -m aegis.stitch_active_patch --zip INPUT/AEGIS_Upstox_Active_Patch_Repaired.zip --output AEGIS_RECONCILED
          python aegis/audit_active_patch.py --patch INPUT/AEGIS_Upstox_Active_Patch_Repaired.zip --out AEGIS_RECONCILED/active_patch_final_audit.json
      - name: Verify complete session dates and exact 2695 futures bars in Parquet
        run: |
          python - <<'PY'
          import json,pathlib,collections,pyarrow.parquet as pq
          root=pathlib.Path("AEGIS_RECONCILED")
          audit=json.loads((root/"active_patch_final_audit.json").read_text())
          manifest=json.loads((root/"active_patch_ingestion.json").read_text())
          tables={
            "futures":pq.read_table(root/"NIFTY_2026_active_futures_patch.parquet"),
            "options":pq.read_table(root/"NIFTY_2026_active_options_patch.parquet")}
          days=["2026-10-28","2026-10-29","2026-10-30","2026-11-02",
                "2026-11-03","2026-11-04","2026-11-05"]
          timestamps=tables["futures"].column("date").to_pylist()
          obs=collections.Counter(str(d) for d in timestamps)
          assert len(tables["futures"])==2695,obs
          assert len(tables["options"])==376301
          assert set(obs)==set(days)
          assert all(obs[d]==385 for d in days),obs
          assert audit["status"]=="integrity_pass" and audit["sha256_csv_passed"]==286,audit
          assert manifest["futures_rows"]==2695 and manifest["option_rows"]==376301
          report={"status":"verified_all_2026_oct28_to_nov05_futures_sessions",
            "source":"Upstox public Historical V3, one token-free 2026-10-28 to 2026-10-30 request plus verified existing ZIP",
            "futures_expiry":"2026-11-23","session_rows":dict(sorted(obs.items())),
            "total_futures_1m":2695,"new_futures_1m":1155,
            "active_options_1m_preserved":376301,
            "sha_verified_contracts":286,
            "invalid_or_outside":audit["invalid_or_outside"],
            "already_completed_option_backtest_2026_net":458.21,
            "note":"Option-only v0.1 P&L unchanged; futures basis not consumed by option-only strategy; no historical bid-ask"}
          (root/"AEGIS_OCT2026_FUTURES_PARQUET_RECONCILIATION.json").write_text(json.dumps(report,indent=2))
          print("AEGIS_FUTURES_PARQUET_RECONCILED",json.dumps(report),flush=True)
          PY
      - name: Save final verified 2026 futures/options patch Parquet
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS_2026_FINAL_VERIFIED_OPTIONS_FUTURES_PARQUET
          path: |
            AEGIS_RECONCILED/NIFTY_2026_active_futures_patch.parquet
            AEGIS_RECONCILED/NIFTY_2026_active_options_patch.parquet
            AEGIS_RECONCILED/AEGIS_OCT2026_FUTURES_PARQUET_RECONCILIATION.json
            AEGIS_RECONCILED/active_patch_ingestion.json
            AEGIS_RECONCILED/active_patch_final_audit.json
          retention-days: 90
